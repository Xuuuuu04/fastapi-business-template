# 全量检查：推送到 main、每个合并请求、手动触发时运行。
# 1. 代码与测试：在真实的 PostgreSQL、Redis、MinIO 上运行与本地相同的 tools.check。
# 2. 部署镜像与配置：构建 deploy/Dockerfile，确认镜像里的应用能导入，校验单机部署配置。
# 第三方 Action 按提交号锁定（注释中是对应版本），由 .github/dependabot.yml 每周检查更新。
name: 全量检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只需要读取代码；不推送、不评论、不发布。
permissions:
  contents: read

# 同一分支有新的推送时，取消还在运行的旧检查。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: server

jobs:
  check:
    name: 代码与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: template
          POSTGRES_DB: template_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 以下变量让 Redis 和 S3 的约定测试参加，说明见 server/tests/README.md。
      APP_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      APP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      APP_TEST_S3_ACCESS_KEY: template
      APP_TEST_S3_SECRET_KEY: template-secret
      POSTGRES_URL: postgresql+psycopg://postgres:template@127.0.0.1:5432/template_test
    steps:
      - name: 取出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 uv（版本与 deploy/Dockerfile 一致）
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      # 服务容器不能指定启动参数，MinIO 需要 "server /data"，所以单独启动并等待就绪。
      - name: 启动 MinIO（S3 兼容存储）
        run: |
          docker run --detach --name minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$APP_TEST_S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$APP_TEST_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1

      - name: 按 uv.lock 安装依赖（锁文件与 pyproject.toml 不一致时失败）
        run: uv sync --locked

      - name: 全量检查（风格、格式、类型、生成文档、SQLite 与 PostgreSQL 测试）
        run: uv run --no-sync python -m tools.check --postgres "$POSTGRES_URL"

  image:
    name: 部署镜像与配置
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 取出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 构建部署镜像
        run: docker build --file deploy/Dockerfile --tag template-server:ci .

      - name: 确认镜像中的接口和 worker 能导入
        run: docker run --rm template-server:ci python -c "import app.setup.web, app.setup.worker"

      # compose 固定读取 server/.env，并要求设置数据库密码；这里只校验配置能否展开。
      - name: 校验单机部署配置
        env:
          DATABASE_PASSWORD: ci-only-password
        run: |
          cp .env.example .env
          docker compose --file deploy/compose.yaml config --quiet
