# main 和手动触发完整检查；合并请求按新旧依赖检查受影响范围，公共变化仍完整检查。
# 1. 代码与测试：在真实的 PostgreSQL、Redis、S3 服务上运行与本地相同的 uv run dev check。
# 2. 部署镜像与配置：构建 deploy/Dockerfile，确认镜像里的应用能导入，校验单机部署配置。
# 第三方 Action 按提交号锁定（注释中是对应版本），由 .github/dependabot.yml 每周检查更新。
name: 分层检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只需要读取代码；不推送、不评论、不发布。
permissions:
  contents: read

# 同一分支有新的推送时，取消还在运行的旧检查。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: server

jobs:
  check:
    name: 代码与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: template
          POSTGRES_DB: template_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 以下变量让 Redis 和 S3 的约定测试参加，说明见 .agents/skills/fastapi-check/references/tests.md。
      APP_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      APP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      APP_TEST_S3_ACCESS_KEY: template
      APP_TEST_S3_SECRET_KEY: template-secret
      POSTGRES_URL: postgresql+psycopg://postgres:template@127.0.0.1:5432/template_test
      CHECK_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: 取出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 安装 uv（版本与 deploy/Dockerfile 一致）
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      # 使用官方发行包提供真实 S3 服务，固定版本和 SHA-256，避免依赖已失效的 MinIO 镜像。
      - name: 启动 S3 测试服务
        env:
          AWS_ACCESS_KEY_ID: ${{ env.APP_TEST_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.APP_TEST_S3_SECRET_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/seaweedfs/data"
          curl --fail --location --retry 2 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.48/linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/seaweedfs/weed.tar.gz"
          echo "4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124  $RUNNER_TEMP/seaweedfs/weed.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/seaweedfs/weed.tar.gz" -C "$RUNNER_TEMP/seaweedfs"
          "$RUNNER_TEMP/seaweedfs/weed" mini -dir="$RUNNER_TEMP/seaweedfs/data" \
            -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3.port=9000 -admin.ui=false \
            > "$RUNNER_TEMP/seaweedfs/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9000/ || true)
            if [ "$status" = "403" ]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/seaweedfs/server.log"
          exit 1

      - name: 按 uv.lock 安装依赖（锁文件与 pyproject.toml 不一致时失败）
        run: uv sync --locked

      - name: 检查（公共变化与主干完整，业务 PR 按受影响范围）
        run: |
          if [ -n "$CHECK_BASE" ]; then
            uv run --no-sync dev check --affected --base "$CHECK_BASE" --postgres "$POSTGRES_URL"
          else
            uv run --no-sync dev check --postgres "$POSTGRES_URL"
          fi

      - name: 保存实际检查轮次（不含数据库地址和业务数据）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-checks
          path: |
            server/var/development/checks/*.json
            server/var/development/checks/_cases/**
            server/var/development/checks/_runs/**
          if-no-files-found: warn
          retention-days: 14

  image:
    name: 部署镜像与配置
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 取出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 构建部署镜像
        run: docker build --file deploy/Dockerfile --tag template-server:ci .

      - name: 确认镜像中的接口、worker 和默认服务结构（不连接数据库）
        run: >-
          docker run --rm template-server:ci python -c
          "import app.setup.web, app.setup.worker;
          from app.setup.build import build;
          from shared.config.settings import Settings;
          build(Settings(_env_file=None, env='test'))"

      # compose 固定读取 server/.env，并要求设置数据库密码；这里只校验配置能否展开。
      - name: 校验单机部署配置
        env:
          DATABASE_PASSWORD: ci-only-password
        run: |
          cp .env.example .env
          docker compose --file deploy/compose.yaml config --quiet
