name: 可选适配器检查

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adapters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: ${{ matrix.adapter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        adapter: [redis, s3]
    defaults:
      run:
        shell: bash
        working-directory: server
    env:
      APP_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      APP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      APP_TEST_S3_ACCESS_KEY: template-test
      APP_TEST_S3_SECRET_KEY: local-ci-only-password
      APP_TEST_S3_BUCKET: template-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - if: matrix.adapter == 'redis'
        run: |
          docker run -d --name adapter-test -p 127.0.0.1:6379:6379 redis:7
          for attempt in {1..30}; do
            docker exec adapter-test redis-cli ping && exit 0
            sleep 1
          done
          exit 1
      - if: matrix.adapter == 's3'
        env:
          MINIO_ROOT_USER: template-test
          MINIO_ROOT_PASSWORD: local-ci-only-password
          MINIO_BROWSER: "off"
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/minio" \
            https://github.com/minio/minio/releases/download/RELEASE.2025-04-22T22-12-26Z/minio.linux-amd64.RELEASE.2025-04-22T22-12-26Z
          sha256sum --check <<< "53e2a2cb16c5366ea6fbbc479c19ddb4c6a0948273e752f740fb1fbf27bb817c  $RUNNER_TEMP/minio"
          chmod +x "$RUNNER_TEMP/minio"
          "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/s3" --address 127.0.0.1:9000 >"$RUNNER_TEMP/minio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/minio.pid"
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:9000/minio/health/ready
      - run: uv run --no-sync python -m pytest -q -ra tests/contracts/test_cache_and_files.py -k '${{ matrix.adapter }}'
      - if: always() && matrix.adapter == 'redis'
        run: docker rm -f adapter-test
      - if: always() && matrix.adapter == 's3'
        run: |
          if test -f "$RUNNER_TEMP/minio.pid"; then kill "$(cat "$RUNNER_TEMP/minio.pid")"; fi
