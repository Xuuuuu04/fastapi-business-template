name: 关键状态模型
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/shared/jobs/**"
      - "server/shared/flow/commit.py"
      - "server/tests/framework/test_job_commit.py"
      - ".agents/skills/fastapi-check/assets/**"
      - ".agents/skills/fastapi-check/scripts/fastapi_check/*model*.py"
      - ".agents/skills/fastapi-check/scripts/fastapi_check/*tla*.py"
      - ".github/workflows/state-model.yml"
  push:
    paths:
      - "server/shared/jobs/**"
      - "server/shared/flow/commit.py"
      - "server/tests/framework/test_job_commit.py"
      - ".agents/skills/fastapi-check/assets/**"
      - ".agents/skills/fastapi-check/scripts/fastapi_check/*model*.py"
      - ".agents/skills/fastapi-check/scripts/fastapi_check/*tla*.py"
      - ".github/workflows/state-model.yml"
permissions:
  contents: read
concurrency:
  group: state-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.9.28"
      - run: uv sync --locked --project server
      - name: 准备固定版本的 TLC
        run: |
          java -version
          curl --fail --location --retry 2 --max-time 120 --proto '=https' --tlsv1.2 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
      - run: cd server && uv run --locked dev verify-model --jar "$RUNNER_TEMP/tla2tools.jar"
