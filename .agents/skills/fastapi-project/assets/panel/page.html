<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>开发面板</title><style>@@STYLE@@</style></head>
<body><header><div><strong id="project-name">开发面板</strong><span id="generated"></span></div><nav><a href="#map">项目图</a><a href="#progress">业务进度</a><a href="#work">任务与分支</a><a href="#attention">待处理</a><a href="#metrics">检查指标</a></nav></header>
<main><section id="map"><div class="section-heading"><h1>项目图</h1><div class="tools"><label>业务线 <select id="line-filter"><option value="">全部</option></select></label><label>查找 <input id="search" placeholder="包名或用途" type="search"></label><button id="fit">适应画布</button></div></div>
<p id="meaning"></p><div id="legend"></div><div class="map-layout"><div id="canvas"><svg id="graph" aria-label="项目包与依赖关系图" role="img"></svg><p id="empty" hidden>还没有设计业务包。先填写项目计划，再生成骨架。</p></div><aside id="detail"><h2>包详情</h2><p>点击图中的包，查看实现、规则和证据来源。</p></aside></div></section>
<section id="progress"><h2>业务进度</h2><div id="line-progress"></div></section>
<section id="work"><h2>任务与分支</h2><h3>当前任务</h3><div id="tasks"></div><h3>分支与工作树</h3><div id="branches"></div><div id="worktrees"></div><div id="overlaps"></div></section>
<section id="attention"><h2>待处理</h2><div id="pending"></div><h3>依赖问题</h3><div id="dependency-issues"></div><h3>重复实现提示</h3><div id="duplicates"></div></section>
<section id="metrics"><h2>检查指标</h2><div id="metric-summary"></div><svg id="history" role="img" aria-label="完整检查耗时变化"></svg><h3>最近完整检查的十项最慢测试</h3><div id="slow-tests"></div><h3>源码规模</h3><div id="sizes"></div></section></main>
<footer>本页由本地文件生成，可离线打开。修改源码后请重新执行 dev panel。<!-- @@LICENSE@@ --></footer>

</body></html>
