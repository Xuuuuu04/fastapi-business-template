# 项目依赖与统一检查配置。
[project]
name = "fastapi-server-template"
version = "0.2.0"
description = "便于阅读和迭代的 FastAPI 单体后端"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "celery>=5.6,<6", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1", "httpx2>=2,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/modules", "tests/integration", "tests/contracts", "tests/architecture", "tests/quality", "tests/security", "tests/recovery"]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]
markers = ["infrastructure: 显式启用的真实 PostgreSQL 与 RabbitMQ 检查"]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
