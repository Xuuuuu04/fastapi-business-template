# 单机部署的组合配置：PostgreSQL、迁移、接口、worker，四者使用同一个镜像和同一份配置。
# 在 server/ 目录执行：docker compose -f deploy/compose.yaml --env-file .env up -d --build
# .env 中需要设置 DATABASE_PASSWORD 和 APP_API_KEYS 等生产配置（见 .env.example）；APP_CODE_VERSION 由 dev deploy 按提交号传入。
x-app: &app
  image: template-server:latest
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: [../.env]
  environment: &app-environment
    APP_ENV: production
    APP_DATABASE_URL: postgresql+psycopg://app:${DATABASE_PASSWORD:?请在 .env 中设置 DATABASE_PASSWORD}@database:5432/app
    APP_RUN_RECORDS: database
    APP_CODE_VERSION: ${APP_CODE_VERSION:-}
    APP_FILE_ROOT: /app/var/files
    APP_UPLOAD_ROOT: /app/var/uploads
    # 信任哪些反向代理传来的 X-Forwarded-For；不设置时只信任容器内的 127.0.0.1，
    # 经宿主机或其他容器上的代理访问时，所有请求的来源地址都会是代理地址，按地址的限流会互相影响
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  volumes: [files:/app/var]
  depends_on:
    database:
      condition: service_healthy

services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?请在 .env 中设置 DATABASE_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "app.setup.worker"]
    environment:
      <<: *app-environment
      APP_JOB_HEALTH_FILE: /tmp/template-worker.health
    healthcheck:
      test: ["CMD", "python", "-m", "app.setup.worker_health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  database: {}
  files: {}
