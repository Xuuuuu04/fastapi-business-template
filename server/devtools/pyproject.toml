[project]
name = "fastapi-template-dev"
version = "5.0.0"
description = "模板的开发命令，只作为产品的开发依赖"
requires-python = ">=3.12,<3.14"
dependencies = ["ijson>=3.3,<4"]

[project.scripts]
dev = "fastapi_dev.main:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_dev"]
